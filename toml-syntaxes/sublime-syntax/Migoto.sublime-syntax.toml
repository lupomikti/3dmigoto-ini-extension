[[contexts.resource-pool]]
match = '''(?xi)
(?=
  Pool
  (?:\\{{namespace}}\\)?
  [^-\\/&!|<( )$=,\r\n]+
  \[ [^\r\n\[\]]+ \]
  (?!\\)
)'''
push = [
  {meta_content_scope = "meta.variable.resource-pool"},
  {
    match = '(?i)\bPool',
    scope = "entity.name.label.migoto",
  },
  {
    match = '(?=\\)',
    push = [{include = "namespace"}],
  },
  {
    match = '(?=\[)',
    push = [
      {meta_scope = "meta.expression.indexing"},
      {
        match = '\[',
        scope = "punctuation.bracket.begin.migoto",
        push = [
          {include = "static-operational-expr"},
          {
            match = '\]',
            scope = "punctuation.bracket.end.migoto",
            pop = 2,
          },
        ],
      },
    ],
  },
  {include = "resource-identifier"},
  {
    match = '(?=[-/&!>|<\s=$,\[\]()])',
    pop = true,
  },
]

[[contexts.namespace]]
match = '\\'
scope = "punctuation.separator.namespace.migoto"
push = [
  {meta_scope = "meta.name.namespace-resolution"},
  {meta_content_scope = "entity.name.namespace.migoto"},
  {
    match = '{{namespace}}(?=\\)',
    push = [
      {
        match = '(?=\\)',
        pop = true,
      }
    ],
  },
  {
    match = '\\',
    scope = "punctuation.separator.namespace.migoto",
    pop = 2,
  },
]

